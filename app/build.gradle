plugins { id 'com.android.application' }
android {
    namespace 'pl.mindupgrade.android'
    compileSdk 36
    defaultConfig {
        applicationId 'pl.mindupgrade.android'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.2.0-bibi-test'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'audience'
    productFlavors {
        personal {
            dimension 'audience'
            buildConfigField 'String', 'APP_PATH', '"/"'
            buildConfigField 'boolean', 'CONSUMER', 'false'
        }
        consumer {
            dimension 'audience'
            applicationId 'pl.mindupgrade.consumer'
            versionCode 1
            versionName '0.1.0-internal'
            buildConfigField 'String', 'APP_PATH', '"/beta"'
            buildConfigField 'boolean', 'CONSUMER', 'true'
        }
    }
    buildTypes {
        release {
            debuggable false
            // Upload signing must be configured outside source before Play submission.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
