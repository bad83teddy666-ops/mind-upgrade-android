name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle verified offline Bibi model
        run: python3 scripts/prepare-bibi-model.py
      - name: Voice bridge tests
        run: node --test tests/*.test.cjs
      - name: Compile and inspect Android application
        run: gradle --no-daemon :app:assemblePersonalDebug :app:lintPersonalDebug :app:assembleConsumerDebug :app:lintConsumerDebug :app:bundleConsumerRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Mind-Upgrade-INTERNAL-UNSIGNED-not-for-Play
          path: |
            app/build/outputs/apk/personal/debug/*.apk
            app/build/outputs/apk/consumer/debug/*.apk
            app/build/outputs/bundle/consumerRelease/*.aab
          if-no-files-found: error
          retention-days: 30
