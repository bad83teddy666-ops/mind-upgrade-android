name: Release APK
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: node --test tests/*.test.cjs
      - run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
      - name: Prepare unsigned APK and signing tool
        run: |
          mkdir -p release-artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Mind-Upgrade-0.3-unsigned
          path: release-artifact/
          retention-days: 30
